<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Page</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <div class="heading">
            <h1>Weather Forecast</h1>
        </div>

        <div class="inputContainer">
            <input type="text" id="cityInput" list="citySuggestions" placeholder="Enter city name" />

            <datalist id="citySuggestions">
            </datalist>

            <button id="getWeatherBtn">Get Weather</button>
        </div>
        </div>
    </header>
    <main>
        <div class="container">
            <div id="weatherResult">
                <div class="location">
                    Mianwali, Pakistan
                </div>
                <div class="currentDate">
                    <div class="date">
                        <div class="day">Monday</div>
                        <div class="date-number">01</div>
                        <div class="month">January</div>
                    </div>
                    <div class="time">
                        <div class="hour">00</div>
                        <div class="dot">::</div>
                        <div class="minute">00</div>
                        <div class="dot">::</div>
                        <div class="second">00</div>
                        <div class="am_pm">AM</div>
                    </div>



                    <div class="weatherDetails">
                        <div class="left">
                            <dotlottie-wc
                                src="https://lottie.host/8f73735d-18e3-4d98-841e-e859530e043a/tDb3sNcNY3.lottie"
                                style="width: 300px; height: 300px;" autoplay loop>
                            </dotlottie-wc>
                        </div>
                        <div class="right">
                            <div class="temperature">32°C</div>
                            <div class="temperatureState">Sunny</div>
                            <div class="feelLike">Feels like 35°C</div>
                        </div>

                    </div>



                    <div class="weatherFactors">
                        <div class="factor">
                            <div class="factorName ">Humidity</div>
                            <div class="factorValue Humidity">60%</div>
                        </div>
                        <div class="factor">
                            <div class="factorName ">Wind Speed</div>
                            <div class="factorValue windSpeed">10 km/h</div>
                        </div>
                        <div class="factor">
                            <div class="factorName ">Pressure</div>
                            <div class="factorValue pressure">1013 hPa</div>
                        </div>
                        <div class="factor">
                            <div class="factorName ">Visibility</div>
                            <div class="factorValue visibility">10 km</div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 Weather App</p>
    </footer>

    <script type="module" src="script.js"></script>
    <script type="module" src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.6.2/dist/dotlottie-wc.js"></script>
</body>

</html>
